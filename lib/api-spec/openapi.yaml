openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Farm Connect agricultural marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Public marketplace and product operations
  - name: account
    description: Signed-in account operations
  - name: farms
    description: Farmer farm management
  - name: billing
    description: Business-owned farmer billing details
  - name: orders
    description: Buyer and farmer order lifecycle
  - name: negotiations
    description: Product price negotiations
  - name: messages
    description: Farmer and buyer conversations
  - name: dashboard
    description: Role-specific dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketplace/overview:
    get:
      operationId: getMarketplaceOverview
      tags: [marketplace]
      summary: Get marketplace counts and featured products
      responses:
        "200":
          description: Marketplace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceOverview"
  /products:
    get:
      operationId: listProducts
      tags: [marketplace]
      summary: Search and filter available products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: organic
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching marketplace products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [marketplace]
      summary: Create a product listing for the signed-in farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /products/{productId}:
    parameters:
      - in: path
        name: productId
        required: true
        schema: { type: integer }
    get:
      operationId: getProduct
      tags: [marketplace]
      summary: Get a product and its public farmer details
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProduct
      tags: [marketplace]
      summary: Update a listing owned by the signed-in farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProduct
      tags: [marketplace]
      summary: Delete a listing owned by the signed-in farmer
      responses:
        "204": { description: Listing deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me:
    get:
      operationId: getMyProfile
      tags: [account]
      summary: Get or create the signed-in user's profile
      responses:
        "200":
          description: Current user's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: completeMyProfile
      tags: [account]
      summary: Complete farmer or business onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      summary: List farms visible to the signed-in user
      responses:
        "200":
          description: Farms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Farm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createFarm
      tags: [farms]
      summary: Create a farm owned by the signed-in farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmInput" }
      responses:
        "201":
          description: Created farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /farms/{farmId}:
    parameters:
      - in: path
        name: farmId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateFarm
      tags: [farms]
      summary: Update a farm owned by the signed-in farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmUpdate" }
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteFarm
      tags: [farms]
      summary: Delete a farm owned by the signed-in farmer
      responses:
        "204": { description: Farm deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/farmer-details:
    get:
      operationId: listBillingFarmerDetails
      tags: [billing]
      summary: List farmer billing details owned by the signed-in business
      responses:
        "200":
          description: Business-owned farmer billing records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingFarmerDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBillingFarmerDetails
      tags: [billing]
      summary: Add a farmer billing contact for the signed-in business
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingFarmerDetailsInput" }
      responses:
        "201":
          description: Saved farmer billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingFarmerDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /billing/farmer-details/{billingDetailsId}:
    parameters:
      - in: path
        name: billingDetailsId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateBillingFarmerDetails
      tags: [billing]
      summary: Update farmer billing details owned by the signed-in business
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingFarmerDetailsUpdate" }
      responses:
        "200":
          description: Updated farmer billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingFarmerDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBillingFarmerDetails
      tags: [billing]
      summary: Delete farmer billing details owned by the signed-in business
      responses:
        "204": { description: Billing details deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get a role-specific dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders related to the signed-in user
      responses:
        "200":
          description: User's related orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order for an available product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order created with payment pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{orderId}/status:
    parameters:
      - in: path
        name: orderId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance or cancel an order the user participates in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{orderId}/demo-payment:
    parameters:
      - in: path
        name: orderId
        required: true
        schema: { type: integer }
    post:
      operationId: createDemoPayment
      tags: [orders]
      summary: Complete a clearly marked development sandbox payment
      responses:
        "200":
          description: Demo payment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /negotiations:
    get:
      operationId: listNegotiations
      tags: [negotiations]
      summary: List negotiations involving the signed-in user
      responses:
        "200":
          description: Related negotiations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Negotiation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createNegotiation
      tags: [negotiations]
      summary: Propose a price and quantity for a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiationInput" }
      responses:
        "201":
          description: Negotiation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Negotiation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /negotiations/{negotiationId}:
    parameters:
      - in: path
        name: negotiationId
        required: true
        schema: { type: integer }
    patch:
      operationId: respondToNegotiation
      tags: [negotiations]
      summary: Accept, reject, or counter a negotiation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiationResponseInput" }
      responses:
        "200":
          description: Updated negotiation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Negotiation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations involving the signed-in user
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start a conversation about a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationInput" }
      responses:
        "201":
          description: Conversation created or existing conversation returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /conversations/{conversationId}/messages:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: integer }
    get:
      operationId: listMessages
      tags: [messages]
      summary: Read messages in a conversation the user participates in
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [account]
      summary: Request an authenticated image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Upload URL and object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  responses:
    BadRequest:
      description: Invalid request or insufficient product quantity
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role or resource ownership does not permit this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: ["string", "null"]
      enum: [farmer, business, admin, null]
    UserProfile:
      type: object
      properties:
        id: { type: integer }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        location: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, displayName, role, location, businessName, createdAt]
    ProfileInput:
      type: object
      properties:
        role: { type: string, enum: [farmer, business] }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        location: { type: string, maxLength: 160 }
        businessName: { type: ["string", "null"], maxLength: 140 }
      required: [role, displayName, location]
    Product:
      type: object
      properties:
        id: { type: integer }
        farmId: { type: ["integer", "null"] }
        farmerId: { type: integer }
        farmerName: { type: string }
        farmName: { type: ["string", "null"] }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        unit: { type: string }
        quantity: { type: number }
        pricePerUnit: { type: number }
        location: { type: string }
        organic: { type: boolean }
        quality: { type: ["string", "null"] }
        harvestDate: { type: ["string", "null"], format: date }
        cropVariety: { type: ["string", "null"], maxLength: 100 }
        plantingDate: { type: ["string", "null"], format: date }
        cultivationMethod: { type: ["string", "null"], maxLength: 120 }
        growthStage: { type: ["string", "null"], maxLength: 60 }
        storageNotes: { type: ["string", "null"], maxLength: 500 }
        imageUrl: { type: ["string", "null"] }
        available: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, farmId, farmerId, farmerName, farmName, name, category, description, unit, quantity, pricePerUnit, location, organic, quality, harvestDate, cropVariety, plantingDate, cultivationMethod, growthStage, storageNotes, imageUrl, available, createdAt]
    ProductInput:
      type: object
      properties:
        farmId: { type: ["integer", "null"] }
        name: { type: string, minLength: 2, maxLength: 100 }
        category: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        unit: { type: string, maxLength: 20 }
        quantity: { type: number, exclusiveMinimum: 0 }
        pricePerUnit: { type: number, exclusiveMinimum: 0 }
        location: { type: string, maxLength: 160 }
        organic: { type: boolean }
        quality: { type: ["string", "null"], maxLength: 80 }
        harvestDate: { type: ["string", "null"], format: date }
        imageUrl: { type: ["string", "null"], format: uri }
        cropVariety: { type: ["string", "null"], maxLength: 100 }
        plantingDate: { type: ["string", "null"], format: date }
        cultivationMethod: { type: ["string", "null"], maxLength: 120 }
        growthStage: { type: ["string", "null"], maxLength: 60 }
        storageNotes: { type: ["string", "null"], maxLength: 500 }
      required: [name, category, description, unit, quantity, pricePerUnit, location, organic]
    ProductUpdate:
      type: object
      properties:
        farmId: { type: ["integer", "null"] }
        name: { type: string, minLength: 2, maxLength: 100 }
        category: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        unit: { type: string, maxLength: 20 }
        quantity: { type: number, minimum: 0 }
        pricePerUnit: { type: number, exclusiveMinimum: 0 }
        location: { type: string, maxLength: 160 }
        organic: { type: boolean }
        quality: { type: ["string", "null"], maxLength: 80 }
        harvestDate: { type: ["string", "null"], format: date }
        imageUrl: { type: ["string", "null"], format: uri }
        cropVariety: { type: ["string", "null"], maxLength: 100 }
        plantingDate: { type: ["string", "null"], format: date }
        cultivationMethod: { type: ["string", "null"], maxLength: 120 }
        growthStage: { type: ["string", "null"], maxLength: 60 }
        storageNotes: { type: ["string", "null"], maxLength: 500 }
        available: { type: boolean }
    BillingFarmerDetails:
      type: object
      properties:
        id: { type: integer }
        farmerName: { type: string }
        farmName: { type: ["string", "null"] }
        gstin: { type: ["string", "null"] }
        billingAddress: { type: string }
        state: { type: string }
        postalCode: { type: string }
        contactPhone: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, farmerName, farmName, gstin, billingAddress, state, postalCode, contactPhone, contactEmail, notes, createdAt, updatedAt]
    BillingFarmerDetailsInput:
      type: object
      properties:
        farmerName: { type: string, minLength: 2, maxLength: 120 }
        farmName: { type: ["string", "null"], maxLength: 120 }
        gstin: { type: ["string", "null"], maxLength: 15, pattern: "^[A-Za-z0-9]{15}$" }
        billingAddress: { type: string, minLength: 5, maxLength: 500 }
        state: { type: string, minLength: 2, maxLength: 80 }
        postalCode: { type: string, pattern: "^[0-9]{6}$" }
        contactPhone: { type: ["string", "null"], maxLength: 24 }
        contactEmail: { type: ["string", "null"], format: email }
        notes: { type: ["string", "null"], maxLength: 500 }
      required: [farmerName, billingAddress, state, postalCode]
    BillingFarmerDetailsUpdate:
      type: object
      properties:
        farmerName: { type: string, minLength: 2, maxLength: 120 }
        farmName: { type: ["string", "null"], maxLength: 120 }
        gstin: { type: ["string", "null"], maxLength: 15, pattern: "^[A-Za-z0-9]{15}$" }
        billingAddress: { type: string, minLength: 5, maxLength: 500 }
        state: { type: string, minLength: 2, maxLength: 80 }
        postalCode: { type: string, pattern: "^[0-9]{6}$" }
        contactPhone: { type: ["string", "null"], maxLength: 24 }
        contactEmail: { type: ["string", "null"], format: email }
        notes: { type: ["string", "null"], maxLength: 500 }
    Farm:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: string }
        acres: { type: number }
        soilType: { type: ["string", "null"] }
        irrigation: { type: ["string", "null"] }
        crops: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, name, location, acres, soilType, irrigation, crops, imageUrl, createdAt]
    FarmInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        location: { type: string, minLength: 2, maxLength: 160 }
        acres: { type: number, exclusiveMinimum: 0 }
        soilType: { type: ["string", "null"] }
        irrigation: { type: ["string", "null"] }
        crops: { type: array, items: { type: string }, maxItems: 20 }
        imageUrl: { type: ["string", "null"], format: uri }
      required: [name, location, acres]
    FarmUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        location: { type: string, minLength: 2, maxLength: 160 }
        acres: { type: number, exclusiveMinimum: 0 }
        soilType: { type: ["string", "null"] }
        irrigation: { type: ["string", "null"] }
        crops: { type: array, items: { type: string }, maxItems: 20 }
        imageUrl: { type: ["string", "null"], format: uri }
    MarketplaceOverview:
      type: object
      properties:
        farmers: { type: integer }
        businesses: { type: integer }
        products: { type: integer }
        transactions: { type: integer }
        featuredProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
      required: [farmers, businesses, products, transactions, featuredProducts]
    DashboardSummary:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        activeOrders: { type: integer }
        completedOrders: { type: integer }
        listings: { type: integer }
        farms: { type: integer }
        pendingNegotiations: { type: integer }
        salesValue: { type: number }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
      required: [role, activeOrders, completedOrders, listings, farms, pendingNegotiations, salesValue, recentOrders]
    Order:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        buyerId: { type: integer }
        buyerName: { type: string }
